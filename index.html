<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giải Cứu Sở Thú - Canva Presentation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #game-wrapper {
            width: 100vw;
            height: 56.25vw; /* Tỉ lệ 16:9 */
            max-height: 100vh;
            max-width: 177.77vh;
            position: relative;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }
        .screen.active { display: block; }

        /* VÙNG BẤM TRONG SUỐT (HOTSPOTS) */
        .hotspot {
            position: absolute;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0);
            border-radius: 15px;
            transition: background-color 0.2s, box-shadow 0.2s;
            z-index: 10;
        }
        .hotspot:hover {
            background-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        /* TỌA ĐỘ CÁC NÚT TRÊN ẢNH (Ước lượng theo ảnh của bạn) */
        /* Nút "Xem gợi ý" ở các trang Thử thách (Ảnh 2,3,4,5) */
        .btn-xem-goi-y { bottom: 5%; right: 25%; width: 22%; height: 9%; }
        
        /* Nút "Quay về" ở các trang Trả lời (Ảnh 6,7,8,9) */
        .btn-quay-ve { bottom: 4.5%; left: 45%; width: 18%; height: 10%; }
        
        /* Nút "Cứu em nữa" ở các trang Trả lời */
        .btn-cuu-em-nua { bottom: 4.5%; right: 15%; width: 22%; height: 10%; }

        /* NÚT CHỌN CON VẬT TRÊN BẢN ĐỒ (Ảnh 1) */
        .animal-btn {
            position: absolute;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.4);
            border: 3px solid #fff;
            border-radius: 20px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5vw;
            font-weight: bold;
            transition: 0.3s;
            text-shadow: 1px 1px 3px #000;
        }
        .animal-btn:hover {
            background-color: rgba(255, 255, 255, 0.8);
            color: #d32f2f;
            transform: scale(1.05);
        }
        .animal-btn.saved {
            background-color: rgba(0, 0, 0, 0.8);
            border-color: #555;
            color: #888;
            text-decoration: line-through;
            pointer-events: none;
        }

        /* NÚT HOÀN THÀNH (Hiện khi cứu đủ 4 con) */
        #btn-finish {
            position: absolute;
            bottom: 10%; left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            font-size: 1.5vw;
            background-color: #4CAF50;
            color: white;
            border: 4px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #btn-finish:hover { background-color: #45a049; }
    </style>
</head>
<body>

<div id="game-wrapper">
    
    <!-- 1. MÀN HÌNH BẢN ĐỒ (Dùng ảnh 1.jpg) -->
    <div id="screen-map" class="screen active" style="background-image: url('1.jpg');">
        <!-- Vị trí các nút chọn con vật (Bạn có thể chỉnh lại % cho khớp với ảnh) -->
        <div id="btn-voi" class="animal-btn" style="left: 5%; top: 50%; width: 18%; height: 30%;" onclick="startChallenge('voi')">Voi Con</div>
        <div id="btn-su_tu" class="animal-btn" style="left: 25%; top: 55%; width: 18%; height: 30%;" onclick="startChallenge('su_tu')">Sư Tử</div>
        <div id="btn-huou" class="animal-btn" style="left: 55%; top: 35%; width: 18%; height: 35%;" onclick="startChallenge('huou')">Hươu Cao Cổ</div>
        <div id="btn-ngua" class="animal-btn" style="left: 70%; top: 55%; width: 18%; height: 30%;" onclick="startChallenge('ngua')">Ngựa Vằn</div>
        
        <button id="btn-finish" onclick="alert('Chúc mừng bạn đã giải cứu thành công cả 4 con vật!')">HOÀN THÀNH NHIỆM VỤ</button>
    </div>

    <!-- 2. CÁC MÀN HÌNH THỬ THÁCH -->
    <!-- Voi (2.jpg) -->
    <div id="screen-tt-voi" class="screen" style="background-image: url('2.jpg');">
        <div class="hotspot btn-xem-goi-y" onclick="showHint('voi')"></div>
    </div>
    <!-- Sư tử (3.jpg) -->
    <div id="screen-tt-su_tu" class="screen" style="background-image: url('3.jpg');">
        <div class="hotspot btn-xem-goi-y" onclick="showHint('su_tu')"></div>
    </div>
    <!-- Hươu (4.jpg) -->
    <div id="screen-tt-huou" class="screen" style="background-image: url('4.jpg');">
        <div class="hotspot btn-xem-goi-y" onclick="showHint('huou')"></div>
    </div>
    <!-- Ngựa (5.jpg) -->
    <div id="screen-tt-ngua" class="screen" style="background-image: url('5.jpg');">
        <div class="hotspot btn-xem-goi-y" onclick="showHint('ngua')"></div>
    </div>

    <!-- 3. CÁC MÀN HÌNH TRẢ LỜI -->
    <!-- Ngựa (6.jpg) -->
    <div id="screen-tl-ngua" class="screen" style="background-image: url('6.jpg');">
        <div class="hotspot btn-quay-ve" onclick="startChallenge('ngua')"></div>
        <div class="hotspot btn-cuu-em-nua" onclick="saveAnimal('ngua')"></div>
    </div>
    <!-- Hươu (7.jpg) -->
    <div id="screen-tl-huou" class="screen" style="background-image: url('7.jpg');">
        <div class="hotspot btn-quay-ve" onclick="startChallenge('huou')"></div>
        <div class="hotspot btn-cuu-em-nua" onclick="saveAnimal('huou')"></div>
    </div>
    <!-- Sư tử (8.jpg) -->
    <div id="screen-tl-su_tu" class="screen" style="background-image: url('8.jpg');">
        <div class="hotspot btn-quay-ve" onclick="startChallenge('su_tu')"></div>
        <div class="hotspot btn-cuu-em-nua" onclick="saveAnimal('su_tu')"></div>
    </div>
    <!-- Voi (9.jpg) -->
    <div id="screen-tl-voi" class="screen" style="background-image: url('9.jpg');">
        <div class="hotspot btn-quay-ve" onclick="startChallenge('voi')"></div>
        <div class="hotspot btn-cuu-em-nua" onclick="saveAnimal('voi')"></div>
    </div>

</div>

<script>
    let savedAnimals = [];

    // Hàm chuyển đổi màn hình
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // Mở trang thử thách
    function startChallenge(animal) {
        showScreen('screen-tt-' + animal);
    }

    // Mở trang gợi ý trả lời
    function showHint(animal) {
        showScreen('screen-tl-' + animal);
    }

    // Lưu con vật đã cứu và quay lại bản đồ
    function saveAnimal(animal) {
        if(!savedAnimals.includes(animal)) {
            savedAnimals.push(animal);
            
            // Cập nhật trạng thái nút trên bản đồ
            const btn = document.getElementById('btn-' + animal);
            btn.classList.add('saved');
            btn.innerHTML = "Đã Cứu";
        }

        // Nếu đã cứu đủ 4 con, hiện nút Hoàn Thành
        if(savedAnimals.length === 4) {
            document.getElementById('btn-finish').style.display = 'block';
        }

        // Quay lại màn hình Bản đồ
        showScreen('screen-map');
    }
</script>

</body>
</html>
